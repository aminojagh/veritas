name: balance_snapshot_to_fx_rate_on_snapshot_date
version: 1
kind: join_path
from_table: fct_balance_snapshot
to_table: fct_fx_rate
on: >
  fct_fx_rate.rate_date = fct_balance_snapshot.snapshot_date
  AND fct_fx_rate.from_currency = fct_balance_snapshot.denomination_currency
  AND fct_fx_rate.to_currency = 'EUR'
