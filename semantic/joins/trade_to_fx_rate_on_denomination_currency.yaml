# The Denomination Currency half of the Section C pair: a Trade's Commission is
# billed in the currency the Trade itself is denominated in. The Quotation Currency
# half is instrument_to_fx_rate_on_quotation_currency, whose comment carries the trap
# the two names exist to keep shut.
name: trade_to_fx_rate_on_denomination_currency
version: 1
kind: join_path
from_table: fct_trade
to_table: fct_fx_rate
on: >
  fct_fx_rate.rate_date = fct_trade.trade_date
  AND fct_fx_rate.from_currency = fct_trade.denomination_currency
  AND fct_fx_rate.to_currency = 'EUR'
