# Trade Date and Settlement Date are a Glossary Section C pair, and there is
# deliberately no `by settlement date` axis: every Metric Definition keys its
# period filter on trade_date, so certifying the other axis would let a question
# be sliced on one date while being filtered on the other.
name: by trade date
version: 1
kind: dimension_definition
description: >
  When a Trade was executed. The axis every trade-side metric — Gross Revenue,
  Net Revenue, Traded Notional, Trade Count — is both filtered and sliced on.
  Distinct from Settlement Date, which is when the cash moves: which of the two a
  period uses shifts revenue across period boundaries and also selects the FX
  Rate, so it moves the number twice.
columns: [fct_trade.trade_date]
grain: daily
allowed_values: []
# `routes` names where the axis can be reached from, and this axis is reachable
# from one place only: the column is on fct_trade, so the route from there is the
# empty list — reaching it costs no join — and every other fact table is an absent
# key. That is what makes R11's fourth ruling enforceable rather than argued: a
# Snapshot metric sliced by Trade Date is refused by name rather than joined to a
# column its route never reaches.
routes:
  fct_trade: []
