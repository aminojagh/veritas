# The word ADR-0001 rejected schema retrieval over: a schema listing cannot say
# that "revenue" has two certified meanings, and this file is that fact.
name: revenue
version: 1
kind: ambiguous_term
description: >
  Gross Revenue is Commission before Rebate and Fee; Net Revenue is what is left
  after both. The gap is the whole of what the broker pays away, so answering the
  wrong one overstates or understates the business by exactly that amount — and
  both are plausible numbers, which is why nothing downstream would notice.
disambiguates: [Gross Revenue, Net Revenue]
resolution: >
  Ask, unless the question names one. "Gross", "net", "before rebates" and "after
  rebates" each name one, and a question carrying one of those has already
  resolved itself.
