# Where Grafana finds the dashboards this repository keeps under version control.
#
# `allowUiUpdates: false` for the reason the datasource is not editable: the file in
# `grafana/dashboards/` is the dashboard, and a panel edited in the browser is a change
# no reviewer can see in a diff.

apiVersion: 1

providers:
  - name: Veritas
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      # Bind-mounted read-only by `docker-compose.yml`. Deliberately not under
      # `/var/lib/grafana`, which is Grafana's own writable state.
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
