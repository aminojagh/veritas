# The whole of Veritas, as three services. The App answers questions on
# http://localhost:8501, Postgres holds the Question Log, and Grafana charts it on
# http://localhost:3000.
#
# Compose reads `.env` from this directory, and so does the App — one set of
# credentials, so a reviewer who copied `.env.example` gets a server and an application
# that agree without editing either.
#
#     docker compose up -d --build          # all three; the first build fetches models
#
# Nothing in `tests/` starts or stops this server: the tests that record into it skip
# when it is not up, and delete the rows they wrote when it is. The module docstring of
# `tests/test_observability.py` says which those are and what `down` and `down -v` cost.

services:
  app:
    # Everything a question needs is in the image — see `Dockerfile`. What is not is
    # the key, which arrives from `.env` below.
    build: .
    container_name: veritas-app
    env_file: .env
    environment:
      # The two values that are not what `.env` says once the App is inside this
      # network. `POSTGRES_HOST` is the service name rather than `localhost`, and
      # `POSTGRES_PORT` is the port Postgres listens on rather than the one compose
      # publishes it as — which are the same number until somebody changes `.env` to
      # free up 5432. Set here rather than in the file because `settings()` reads the
      # environment first, so this wins for the container and the file still holds
      # what `uv run streamlit …` on the host should use.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      # The App applies `schema.sql` when it first records. Against a server still
      # starting, the first question would be answered and not written down.
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8501}:8501"
    healthcheck:
      # Streamlit's own endpoint, called with the interpreter already in the image —
      # `curl` is not, and installing it to ask one question would be a layer for a
      # one-line script. `--wait` reads this, so `up --wait` returning means the page
      # is being served rather than that the container started.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Streamlit answers this endpoint as soon as it is listening, before any page has
      # been loaded — so what the start period covers is the server booting, not the
      # Warehouse, the indexes or the models. Those are built when the first page loads,
      # under a spinner a person can see.
      start_period: 30s

  postgres:
    image: postgres:18-alpine
    container_name: veritas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # The App connects over the published port, so `POSTGRES_PORT` is the one value
      # both sides read: change it here and the App follows.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # The whole directory rather than `data/` under it: from Postgres 18 the image
      # keeps its data in a major-version subdirectory, and a volume mounted one level
      # down leaves the server refusing to start on an "unused mount/volume".
      - question-log:/var/lib/postgresql
    healthcheck:
      # `docker compose up` returns before Postgres is ready to answer, and a first
      # question asked in that window would be answered and not recorded.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.3.0
    container_name: veritas-grafana
    depends_on:
      # Grafana provisions its datasource at start-up. Against a server still starting
      # it would come up with a datasource that answers nothing until someone reloads.
      postgres:
        condition: service_healthy
    environment:
      # The datasource file interpolates these three from Grafana's own environment, so
      # the charts read the server with the credentials that created it.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      # The dashboard is what this Grafana is for, so it is the page the root URL
      # serves and a reader signs in for nothing.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/question-log.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      # Read-only, both of them: the files in `grafana/` are the dashboard and the
      # datasource, and a change made in the browser is a change no diff would show.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  # Named, so `docker compose down` keeps the Question Log and `down -v` empties it.
  question-log:
# Grafana gets no volume: its datasource, its dashboard and its login all come from
# files and from `.env` on every start, so the only thing a volume would carry over is
# state nobody set.
