name: Position Change in the second quarter of 2026
question: how much did our positions change in the second quarter of 2026
expects: answer
sql: |
  SELECT sum(fct_position_snapshot.quantity - coalesce((SELECT previous_snapshot.quantity FROM fct_position_snapshot AS previous_snapshot WHERE previous_snapshot.account_id = fct_position_snapshot.account_id AND previous_snapshot.instrument_id = fct_position_snapshot.instrument_id AND previous_snapshot.snapshot_date < fct_position_snapshot.snapshot_date ORDER BY previous_snapshot.snapshot_date DESC LIMIT 1), 0)) AS answer
  FROM fct_position_snapshot
  JOIN dim_account ON dim_account.account_id = fct_position_snapshot.account_id
  JOIN dim_client ON dim_client.client_id = dim_account.client_id
  WHERE dim_client.client_region = 'EU' AND fct_position_snapshot.snapshot_date BETWEEN '2026-04-01' AND '2026-06-30'
result:
  - [1208591.000000]
