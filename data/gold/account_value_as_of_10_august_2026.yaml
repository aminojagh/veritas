# The composed form, and the only correct statement there is: Account Value is
# "Cash Balance plus all Positions marked to market", and the two halves are rooted at
# two Snapshot tables that join on nothing without multiplying rows. The Validation
# Gate refuses this statement as a Shadow Metric, which is DEBT-035.
name: Account Value as of 10 August 2026
question: what was the total account value as of 10 August 2026
expects: answer
sql: |
  SELECT (
  SELECT sum(CAST(fct_position_snapshot.quantity AS DECIMAL(38, 6)) * fct_instrument_price.market_price * fct_fx_rate.fx_rate) AS answer
  FROM fct_position_snapshot
  JOIN dim_instrument ON dim_instrument.instrument_id = fct_position_snapshot.instrument_id
  JOIN fct_instrument_price ON fct_instrument_price.price_date = fct_position_snapshot.snapshot_date AND fct_instrument_price.instrument_id = fct_position_snapshot.instrument_id
  JOIN fct_fx_rate ON fct_fx_rate.rate_date = fct_position_snapshot.snapshot_date AND fct_fx_rate.from_currency = dim_instrument.quotation_currency AND fct_fx_rate.to_currency = 'EUR'
  JOIN dim_account ON dim_account.account_id = fct_position_snapshot.account_id
  JOIN dim_client ON dim_client.client_id = dim_account.client_id
  WHERE dim_client.client_region = 'EU' AND fct_position_snapshot.snapshot_date = '2026-08-10'
  ) + (
  SELECT sum(CAST(fct_balance_snapshot.cash_balance AS DECIMAL(38, 6)) * fct_fx_rate.fx_rate) AS answer
  FROM fct_balance_snapshot
  JOIN fct_fx_rate ON fct_fx_rate.rate_date = fct_balance_snapshot.snapshot_date AND fct_fx_rate.from_currency = fct_balance_snapshot.denomination_currency AND fct_fx_rate.to_currency = 'EUR'
  JOIN dim_account ON dim_account.account_id = fct_balance_snapshot.account_id
  JOIN dim_client ON dim_client.client_id = dim_account.client_id
  WHERE dim_client.client_region = 'EU' AND fct_balance_snapshot.snapshot_date = '2026-08-10'
  ) AS answer
result:
  - [34972516.937747]
