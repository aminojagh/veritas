name: Unrealised P&L by instrument type as of 10 August 2026
question: break our unrealised P&L down by instrument type as of 10 August 2026
expects: answer
sql: |
  SELECT dim_instrument.instrument_type AS slice, sum((CAST(fct_position_snapshot.quantity AS DECIMAL(38, 6)) * fct_instrument_price.market_price - fct_position_snapshot.cost_basis) * fct_fx_rate.fx_rate) AS answer
  FROM fct_position_snapshot
  JOIN dim_instrument ON dim_instrument.instrument_id = fct_position_snapshot.instrument_id
  JOIN fct_instrument_price ON fct_instrument_price.price_date = fct_position_snapshot.snapshot_date AND fct_instrument_price.instrument_id = fct_position_snapshot.instrument_id
  JOIN fct_fx_rate ON fct_fx_rate.rate_date = fct_position_snapshot.snapshot_date AND fct_fx_rate.from_currency = dim_instrument.quotation_currency AND fct_fx_rate.to_currency = 'EUR'
  JOIN dim_account ON dim_account.account_id = fct_position_snapshot.account_id
  JOIN dim_client ON dim_client.client_id = dim_account.client_id
  WHERE dim_client.client_region = 'EU' AND fct_position_snapshot.snapshot_date = '2026-08-10'
  GROUP BY dim_instrument.instrument_type
  ORDER BY dim_instrument.instrument_type
result:
  - ["ETF", -1410.140729]
  - ["currency pair", 22270.951974]
  - ["equity", 683358.603622]
  - ["future", 256332.989883]
