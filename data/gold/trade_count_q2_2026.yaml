name: Trade Count in the second quarter of 2026
question: how many trades did we make in the second quarter of 2026
expects: answer
sql: |
  SELECT count(fct_trade.trade_id) AS answer
  FROM fct_trade
  JOIN dim_account ON dim_account.account_id = fct_trade.account_id
  JOIN dim_client ON dim_client.client_id = dim_account.client_id
  WHERE dim_client.client_region = 'EU' AND fct_trade.trade_date BETWEEN '2026-04-01' AND '2026-06-30'
result:
  - [72]
